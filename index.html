<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測驗系統 - 主選單</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 400px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #2980b9; }
        .quiz-item { padding: 10px; border: 1px solid #eee; margin-top: 10px; border-radius: 8px; cursor: pointer; }
        .quiz-item:hover { background: #f9f9f9; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="home">
        <h2 style="text-align:center;">📝 模擬測驗系統</h2>
        <input type="text" id="username" placeholder="輸入姓名">
        <input type="text" id="quizcode" placeholder="輸入題庫代碼">
        <button onclick="goToQuiz()">開始考試</button>
        <hr>
        <h4>快速查看排行榜</h4>
        <div id="quiz-list"></div>
    </div>

    <div id="rank" class="hidden">
        <button onclick="showHome()" style="background:#95a5a6;">返回首頁</button>
        <div id="rank-data"></div>
    </div>
</div>

<script src="quiz_list.js"></script>
<script>
    // 初始化清單
    window.onload = () => {
        const container = document.getElementById('quiz-list');
        if (window.allQuizzes) {
            window.allQuizzes.forEach(q => {
                const div = document.createElement('div');
                div.className = 'quiz-item';
                div.innerHTML = `<b>${q.name}</b><br><small>${q.code}</small>`;
                div.onclick = () => showRank(q.code);
                container.appendChild(div);
            });
        }
    };

    function goToQuiz() {
        const user = document.getElementById('username').value;
        const code = document.getElementById('quizcode').value;
        if (!user || !code) return alert("請填寫姓名與代碼");
        // 核心修復：確保轉跳路徑正確
        window.location.href = `quiz.html?code=${code}&user=${encodeURIComponent(user)}`;
    }

    function showRank(code) {
        document.getElementById('home').classList.add('hidden');
        document.getElementById('rank').classList.remove('hidden');
        const logs = JSON.parse(localStorage.getItem('qz_logs') || '[]');
        const filtered = logs.filter(l => l.code === code).sort((a,b) => b.score - a.score);
        
        let html = `<h3>${code} 排名</h3>`;
        if(filtered.length === 0) html += "<p>尚無紀錄</p>";
        else {
            html += "<ul>";
            filtered.forEach(l => html += `<li>${l.user}: ${l.score}分</li>`);
            html += "</ul>";
        }
        document.getElementById('rank-data').innerHTML = html;
    }

    function showHome() {
        document.getElementById('rank').classList.add('hidden');
        document.getElementById('home').classList.remove('hidden');
    }
</script>
</body>
</html>
