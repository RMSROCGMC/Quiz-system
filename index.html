<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>題測系統</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --error: #e74c3c; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 15px; user-select: none; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .input-group { margin-bottom: 15px; }
        .code-input { width: 90%; padding: 12px; font-size: 1.1em; text-align: center; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .main-btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.2em; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .search-area { background: #f8f9fa; padding: 12px; border-radius: 10px; margin-bottom: 20px; border: 1px dashed #bbb; }
        #search-results, .list-box { text-align: left; max-height: 200px; overflow-y: auto; background: white; margin-top: 5px; border: 1px solid #eee; }
        .res-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.95em; }
        .hidden { display: none; }
        .question-card { text-align: left; padding: 15px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 15px; background: #fff; }
        .opt-btn { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; background: #fff; text-align: left; cursor: pointer; }
        .opt-btn.selected { background: var(--secondary); color: white; border-color: var(--secondary); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: var(--primary); color: white; }
        .review-card { text-align: left; border-left: 5px solid #eee; padding-left: 10px; margin-bottom: 15px; }
        #timer-box { font-size: 1.1em; color: var(--error); font-weight: bold; background: #fff0f0; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--error); }
    </style>
</head>
<body>

<div class="container">
    <div id="terms-screen">
        <h2>🛡️ 數據採集授權告知</h2>
        <div style="text-align:left; background:#f9f9f9; padding:15px; border:1px solid #ddd; height:180px; overflow-y:auto; margin-bottom:20px; font-size:0.9em; line-height:1.6;">
            本系統為「後方數據庫」測驗平台。當您開始測驗時，系統將自動搜集您的：姓名、測驗代碼、測驗成績及作答時間。
            所有數據將即時上傳至 Google 試算表後端。點擊下方按鈕即代表您已閱讀並同意以上條款。
        </div>
        <button class="main-btn" style="background:var(--primary);" onclick="agreeTerms()">同意並進入系統</button>
    </div>

    <div id="login-screen" class="hidden">
        <h2 id="admin-title">線上題測系統</h2>
        <div class="search-area">
            <input type="text" id="search-input" class="code-input" placeholder="🔍 搜尋測驗 (例如: 國防)">
            <div id="search-results"></div>
        </div>
        <div class="input-group">
            <input type="text" id="user-name" class="code-input" placeholder="請輸入姓名" required>
            <input type="text" id="quiz-code" class="code-input" placeholder="請輸入代碼 (例: 101)">
            <div id="status-msg" style="font-weight:bold; color:var(--secondary); margin-top:5px;">等待遠端連線...</div>
        </div>
        <button id="start-btn" class="main-btn" onclick="checkAndStart()" style="background:#ccc;" disabled>尚未讀取數據</button>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="main-btn" style="background:var(--primary); font-size:0.9em;" onclick="openLeaderboard()">🏆 排行榜</button>
            <button class="main-btn" style="background:#6c757d; font-size:0.9em;" onclick="openHistory()">📖 答題紀錄</button>
        </div>
    </div>

    <div id="list-screen" class="hidden">
        <h3 id="list-title">排行榜</h3>
        <div id="list-content" class="list-box"></div>
        <button class="main-btn" style="background:#95a5a6;" onclick="backToMain()">返回主選單</button>
    </div>

    <div id="quiz-ui" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:bold;">
            <span id="quiz-header">測驗載入中</span>
            <div id="timer-box">⏳ 剩餘：<span id="time-left">00:00</span></div>
            <span id="cheat-warn" style="color:var(--error);">警告：0</span>
        </div>
        <div id="quiz-container"></div>
        <button class="main-btn" style="background:var(--primary);" onclick="confirmSubmit()">提交數據並同步後端</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2 id="res-type">測驗結算報告</h2>
        <h1 id="final-score" style="font-size: 3.5em; color:var(--secondary); margin:10px 0;">0</h1>
        <div id="admin-tools" class="hidden">
            <input type="number" id="admin-fix-input" placeholder="修改分數" style="width:100px; padding:8px;">
            <button onclick="adminFix()">套用</button>
        </div>
        <p id="pass-status" style="font-size:1.2em; font-weight:bold;"></p>
        <div style="display:flex; gap:10px;">
            <button class="main-btn" style="background:#95a5a6;" onclick="location.reload()">回首頁</button>
            <button id="retry-btn" class="main-btn" style="background:var(--success); display:none;" onclick="startRetry()">錯題重測</button>
        </div>
        <div id="review-area" style="margin-top:20px; border-top:2px solid #eee; padding-top:15px;"></div>
    </div>
</div>

<script src="quiz_list.js"></script>

<script>
    const FORM = {
        id: "1FAIpQLSde9mu2wiBDl6x50wcFcnoYKZUtaY6odqmVzqubW1OPpMfkHw",
        entryName: "entry.880479708",
        entryQuiz: "entry.1444158913",
        entryScore: "entry.1691238421"
    };

    let isAdmin = false, quizActive = false, isRetry = false, cheats = 0;
    let currentQuestions = [], wrongs = [], userAnswers = {}, timerInterval, totalSeconds = 0;

    function agreeTerms() {
        document.getElementById('terms-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

    document.getElementById('user-name').addEventListener('input', (e) => {
        if (e.target.value === 'admin990420') {
            isAdmin = true;
            document.getElementById('admin-title').innerText = "張永旭(Admin) 控制模式";
            document.getElementById('admin-title').style.color = "red";
        }
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
        const key = e.target.value.toLowerCase();
        const res = document.getElementById('search-results');
        res.innerHTML = '';
        if(!key || !window.allQuizzes) return;
        window.allQuizzes.filter(q => q.name.includes(key)).forEach(q => {
            const d = document.createElement('div');
            d.className = 'res-item';
            d.innerHTML = `📌 ${q.name} (${q.code})`;
            d.onclick = () => {
                document.getElementById('quiz-code').value = q.code;
                document.getElementById('search-input').value = q.name;
                res.innerHTML = '';
                document.getElementById('quiz-code').dispatchEvent(new Event('input'));
            };
            res.appendChild(d);
        });
    });

    document.getElementById('quiz-code').addEventListener('input', (e) => {
        const code = e.target.value.trim();
        if(code) {
            const old = document.getElementById('q-script'); if(old) old.remove();
            const s = document.createElement('script');
            s.id = 'q-script'; s.src = `${code}.js`;
            s.onload = () => {
                if(window.currentQuiz) {
                    document.getElementById('status-msg').innerText = `✅ 已連線：${window.currentQuiz.name}`;
                    document.getElementById('start-btn').disabled = false;
                    document.getElementById('start-btn').style.background = "var(--success)";
                    document.getElementById('start-btn').innerText = "進入數據庫測驗";
                }
            };
            document.head.appendChild(s);
        }
    });

    function checkAndStart() {
        const userName = document.getElementById('user-name').value.trim();
        if(!userName) return alert("⚠️ 系統提示：請先輸入姓名才能開始測驗！");
        alert("⚠️ 系統提示：按下確認後將進入全螢幕並開始計時，中途離開超過1次將強制交卷！");
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        isRetry = false;
        beginQuiz();
    }

    function beginQuiz() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('quiz-ui').classList.remove('hidden');
        document.getElementById('quiz-header').innerText = window.currentQuiz.name;
        
        let raw = isRetry ? wrongs : window.currentQuiz.data;
        currentQuestions = applyMode(window.currentQuiz.mode, raw);
        userAnswers = {};
        
        // --- 修改處：讀取題庫內的 time 屬性 ---
        // 如果題庫有寫 time: 10，就給 10 分鐘；如果沒寫，預設每題 1.5 分鐘
        const setTime = window.currentQuiz.time;
        if (setTime) {
            totalSeconds = setTime * 60;
        } else {
            totalSeconds = currentQuestions.length * 1.5 * 60; 
        }
        
        updateTimerDisplay();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            totalSeconds--;
            updateTimerDisplay();
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                alert("⏰ 時間到！系統自動交卷！");
                evalQuiz();
            }
        }, 1000);

        quizActive = true;
        renderQuiz();
    }

    function updateTimerDisplay() {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        document.getElementById('time-left').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function applyMode(mode, data) {
        let d = JSON.parse(JSON.stringify(data));
        if (mode === 2 || mode === 4) d.sort(() => Math.random() - 0.5);
        if (mode === 3 || mode === 4) {
            d.forEach(item => {
                const correctTxt = item.o.find(o => o.startsWith(`(${item.a})`)).substring(3);
                let opts = item.o.map(o => o.substring(3)).sort(() => Math.random() - 0.5);
                item.o = opts.map((t, i) => {
                    const l = String.fromCharCode(65 + i);
                    if(t === correctTxt) item.a = l;
                    return `(${l})${t}`;
                });
            });
        }
        return d;
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        currentQuestions.forEach((q, i) => {
            const card = document.createElement('div'); card.className = 'question-card';
            card.innerHTML = `<p><strong>${i+1}. ${q.q}</strong></p><div id="opts-${i}"></div>`;
            container.appendChild(card);
            q.o.forEach(opt => {
                const b = document.createElement('button'); b.className = 'opt-btn'; b.innerText = opt;
                b.onclick = () => {
                    userAnswers[i] = opt.charAt(1);
                    Array.from(b.parentElement.children).forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                };
                document.getElementById(`opts-${i}`).appendChild(b);
            });
        });
    }

    function confirmSubmit() { if(confirm("確定結束測驗並同步成績？")) evalQuiz(); }

    function evalQuiz() {
        quizActive = false;
        clearInterval(timerInterval);
        document.getElementById('quiz-ui').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let correctCount = 0, perValue = 100 / currentQuestions.length;
        wrongs = [];
        let reviewHTML = '<h3>答案解析與訂正</h3>';

        currentQuestions.forEach((q, i) => {
            const isRight = userAnswers[i] === q.a;
            if(isRight) correctCount++; else wrongs.push(q);
            reviewHTML += `<div class="review-card" style="border-left-color:${isRight?'var(--success)':'var(--error)'}">
                <p><b>Q${i+1}: ${q.q}</b></p>
                <p style="color:${isRight?'green':'red'}">${isRight?'✅ 正確':'❌ 錯誤'}</p>
                <p>您的答案：${userAnswers[i]||'未填'} / 正確答案：${q.a}</p>
            </div>`;
        });

        const score = Math.round(correctCount * perValue);
        document.getElementById('final-score').innerText = score;
        document.getElementById('pass-status').innerText = score >= 60 ? "🎉 及格" : "❌ 不及格";
        document.getElementById('pass-status').style.color = score >= 60 ? "green" : "red";
        document.getElementById('review-area').innerHTML = reviewHTML;

        if (isAdmin) document.getElementById('admin-tools').classList.remove('hidden');
        if (!isRetry) { sendCloud(score); logLocal(score); }
        document.getElementById('retry-btn').style.display = (wrongs.length > 0) ? 'block' : 'none';
    }

    function adminFix() {
        const val = document.getElementById('admin-fix-input').value;
        document.getElementById('final-score').innerText = val;
        alert("管理員已修正為 " + val);
    }

    function sendCloud(s) {
        const body = new URLSearchParams();
        body.append(FORM.entryName, document.getElementById('user-name').value + (isAdmin ? "(Admin)" : ""));
        body.append(FORM.entryQuiz, `${window.currentQuiz.name}(${document.getElementById('quiz-code').value})`);
        body.append(FORM.entryScore, s);
        fetch(`https://docs.google.com/forms/d/e/${FORM.id}/formResponse`, { method: "POST", mode: "no-cors", body: body });
    }

    function logLocal(s) {
        let history = JSON.parse(localStorage.getItem('qz_logs') || '[]');
        history.push({ user: document.getElementById('user-name').value, code: document.getElementById('quiz-code').value, title: window.currentQuiz.name, score: s, time: new Date().toLocaleString() });
        localStorage.setItem('qz_logs', JSON.stringify(history));
    }

    function openHistory() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('list-screen').classList.remove('hidden');
        document.getElementById('list-title').innerText = "📖 本地答題紀錄";
        let logs = JSON.parse(localStorage.getItem('qz_logs') || '[]');
        let h = '<table><tr><th>時間</th><th>測驗項目</th><th>成績</th></tr>';
        logs.reverse().forEach(l => h += `<tr><td>${l.time}</td><td>${l.title}</td><td>${l.score}</td></tr>`);
        document.getElementById('list-content').innerHTML = h + '</table>';
    }

    function openLeaderboard() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('list-screen').classList.remove('hidden');
        document.getElementById('list-title').innerText = "🏆 請選擇代碼查看排名";
        let logs = JSON.parse(localStorage.getItem('qz_logs') || '[]');
        let codes = [...new Set(logs.map(l => l.code))];
        let h = '';
        codes.forEach(c => h += `<div class="res-item" onclick="showRank('${c}')">📈 點此查看 [${c}] 排名</div>`);
        document.getElementById('list-content').innerHTML = h || '目前無紀錄';
    }

    function showRank(c) {
        let logs = JSON.parse(localStorage.getItem('qz_logs') || '[]');
        let filtered = logs.filter(l => l.code === c).sort((a,b) => b.score - a.score);
        let h = `<h4>代碼 ${c} 排名表</h4><table><tr><th>排名</th><th>姓名</th><th>成績</th></tr>`;
        filtered.forEach((l, i) => h += `<tr><td>${i+1}</td><td>${l.user}</td><td>${l.score}</td></tr>`);
        document.getElementById('list-content').innerHTML = h + '</table>';
    }

    function startRetry() { isRetry = true; document.getElementById('result-screen').classList.add('hidden'); beginQuiz(); }
    function backToMain() { document.getElementById('list-screen').classList.add('hidden'); document.getElementById('login-screen').classList.remove('hidden'); }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden && quizActive) {
            cheats++;
            document.getElementById('cheat-warn').innerText = "警告：" + cheats;
            if (cheats > 1) { alert("偵測到中途離開，強制交卷！"); evalQuiz(); }
        }
    });
</script>
</body>
</html>
