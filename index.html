<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子數據檢測測驗系統</title>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']], processEscapes: true },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --error: #e74c3c; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 15px; user-select: none; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .code-input { width: 90%; padding: 12px; font-size: 1.1em; text-align: center; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .main-btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.2em; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .hidden { display: none; }
        .question-card { text-align: left; padding: 15px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 15px; background: #fff; }
        .opt-btn { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; background: #fff; text-align: left; cursor: pointer; }
        .opt-btn.selected { background: var(--secondary); color: white; border-color: var(--secondary); }
        .review-card { text-align: left; border-left: 5px solid #eee; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        #timer-box { font-size: 1.1em; color: var(--error); font-weight: bold; background: #fff0f0; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--error); }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false">

<div class="container">
    <div id="login-screen">
        <h2>🔒 測驗安全終端</h2>
        <div class="input-group">
            <input type="text" id="user-name" class="code-input" placeholder="考生真實姓名">
            <input type="text" id="quiz-code" class="code-input" placeholder="測驗代碼 (Code)">
            
            <div id="password-area" class="hidden" style="margin-top: 10px;">
                <input type="password" id="quiz-pass" class="code-input" placeholder="請輸入題庫密碼" style="border-color: var(--secondary);">
            </div>
            
            <div id="status-msg" style="color:var(--secondary); font-size: 0.85em; margin: 10px 0;">等待伺服器連線...</div>
        </div>
        <button id="start-btn" class="main-btn" onclick="checkAndStart()" style="background:#ccc;" disabled>尚未讀取數據</button>
    </div>

    <div id="quiz-ui" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span id="quiz-header" style="font-weight:bold;">載入中...</span>
            <div id="timer-box">⏳ <span id="time-left">00:00</span></div>
        </div>
        <div id="quiz-container"></div>
        <button class="main-btn" style="background:var(--primary);" onclick="confirmSubmit()">傳送數據並同步</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2>📊 數據檢測報告</h2>
        <h1 id="final-score" style="font-size: 4em; color:var(--secondary); margin: 0.2em 0;">0</h1>
        <p id="pass-status" style="font-weight:bold; font-size: 1.2em;"></p>
        <button class="main-btn" style="background:#95a5a6;" onclick="location.reload()">離開系統</button>
        <div id="review-area" style="margin-top:20px; border-top:2px solid #ddd; padding-top:15px;"></div>
    </div>
</div>

<script>
    const _secret = "MUZBSXBRTFNkZTltdTJ3aUJEbDZ4NTB3Y0Zjbm9ZS1pVdGFFNm9kcW1WenF1YlcxT1BwTWZrSHc=";
    const ENDPOINT = atob(_secret);

    let isAdmin = false, quizActive = false, cheats = 0;
    let currentQuestions = [], userAnswers = {}, timerInterval, totalSeconds = 0;

    // 禁用快捷鍵
    document.onkeydown = (e) => { if (e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 73))) return false; };

    // 密碼邏輯處理
    document.getElementById('quiz-code').addEventListener('input', (e) => {
        const code = e.target.value.trim();
        if(code) {
            const old = document.getElementById('q-script'); if(old) old.remove();
            const s = document.createElement('script');
            s.id = 'q-script'; s.src = `${code}.js`;
            s.onload = () => {
                if(window.currentQuiz) {
                    document.getElementById('status-msg').innerText = `✅ 已尋獲：${window.currentQuiz.name}`;
                    // 如果題庫有密碼，顯示密碼框
                    if(window.currentQuiz.password) {
                        document.getElementById('password-area').classList.remove('hidden');
                        document.getElementById('status-msg').innerText += " (受保護的題庫)";
                    } else {
                        document.getElementById('password-area').classList.add('hidden');
                    }
                    document.getElementById('start-btn').disabled = false;
                    document.getElementById('start-btn').style.background = "var(--success)";
                }
            };
            document.head.appendChild(s);
        }
    });

    function checkAndStart() {
        const userName = document.getElementById('user-name').value.trim();
        if(!userName) return alert("請輸入姓名");
        
        // 驗證密碼
        if(window.currentQuiz.password) {
            const userPass = document.getElementById('quiz-pass').value;
            if(userPass !== window.currentQuiz.password) {
                return alert("❌ 題庫密碼錯誤，請詢問管理員！");
            }
        }

        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        beginQuiz();
    }

    function beginQuiz() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('quiz-ui').classList.remove('hidden');
        const quiz = window.currentQuiz;
        document.getElementById('quiz-header').innerText = quiz.name;
        
        currentQuestions = JSON.parse(JSON.stringify(quiz.data)).sort(() => Math.random() - 0.5);
        totalSeconds = (quiz.time || 25) * 60;
        
        timerInterval = setInterval(() => {
            totalSeconds--;
            const mins = Math.floor(totalSeconds / 60), secs = totalSeconds % 60;
            document.getElementById('time-left').innerText = `${mins}:${secs.toString().padStart(2,'0')}`;
            if (totalSeconds <= 0) evalQuiz();
        }, 1000);
        quizActive = true;
        renderQuiz();
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        currentQuestions.forEach((q, i) => {
            const card = document.createElement('div'); card.className = 'question-card';
            card.innerHTML = `<p><strong>Q${i+1}. ${q.q}</strong></p><div id="opts-${i}"></div>`;
            container.appendChild(card);
            
            // 選項隨機化
            const shuffledOpts = [...q.o].sort(() => Math.random() - 0.5);
            shuffledOpts.forEach(opt => {
                const b = document.createElement('button'); b.className = 'opt-btn'; b.innerText = opt;
                b.onclick = () => {
                    userAnswers[i] = opt.match(/\(([A-D])\)/)[1];
                    Array.from(b.parentElement.children).forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                };
                document.getElementById(`opts-${i}`).appendChild(b);
            });
        });
        if (window.MathJax) MathJax.typesetPromise([container]);
    }

    function confirmSubmit() { if(confirm("確定提交？")) evalQuiz(); }

    function evalQuiz() {
        quizActive = false;
        clearInterval(timerInterval);
        document.getElementById('quiz-ui').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        let correctCount = 0;
        let reviewHTML = '<h3>❌ 錯題訂正與正確公式</h3>';
        
        currentQuestions.forEach((q, i) => {
            const correctOptStr = q.o.find(str => str.startsWith(`(${q.a})`));
            const isRight = userAnswers[i] === q.a;
            if(isRight) correctCount++;
            
            reviewHTML += `
                <div class="review-card" style="border-left: 5px solid ${isRight?'var(--success)':'var(--error)'}">
                    <p><b>Q${i+1}: ${q.q}</b></p>
                    <p>您選擇：${userAnswers[i]||'未填'} | <span style="color:var(--success)">正確答案：${correctOptStr}</span></p>
                </div>`;
        });

        const score = Math.round(correctCount * (100 / currentQuestions.length));
        document.getElementById('final-score').innerText = score;
        document.getElementById('review-area').innerHTML = reviewHTML;
        
        // 判定及格
        const ps = document.getElementById('pass-status');
        ps.innerText = score >= 60 ? "判定：及格" : "判定：不及格";
        ps.style.color = score >= 60 ? "green" : "red";

        sendCloud(score);
        if (window.MathJax) MathJax.typesetPromise([document.getElementById('review-area')]);
    }

    function sendCloud(s) {
        const body = new URLSearchParams();
        body.append("entry.880479708", document.getElementById('user-name').value);
        body.append("entry.1444158913", window.currentQuiz.name);
        body.append("entry.1691238421", s);
        fetch(`https://docs.google.com/forms/d/e/${ENDPOINT}/formResponse`, { method: "POST", mode: "no-cors", body: body });
    }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden && quizActive) {
            cheats++;
            if (cheats > 1) { alert("偵測到異常操作，強制繳交！"); evalQuiz(); }
        }
    });
</script>
</body>
</html>
