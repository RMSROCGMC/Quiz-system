<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模擬測驗系統</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; }
        .menu-item { padding: 15px; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .menu-item:hover { background: #eef7ff; border-color: var(--accent); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        th { background: var(--primary); color: white; }
        .pass-line { background: #fff0f0; color: #e74c3c; font-size: 0.85em; font-weight: bold; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="main-app">
    <div id="home-screen">
        <h2 style="text-align:center;">🏆 測驗排行榜系統</h2>
        <div style="margin-bottom:20px;">
            <input type="text" id="user-name" placeholder="請輸入姓名" style="width:95%; padding:10px; margin-bottom:10px;">
            <input type="text" id="quiz-code" placeholder="請輸入題庫代碼 (如 MH-1140202-E1B)" style="width:95%; padding:10px;">
        </div>
        <button onclick="startQuiz()">開始測驗</button>
        <hr>
        <h3>📊 選擇題庫查看排名</h3>
        <div id="quiz-list-container">
            </div>
    </div>

    <div id="rank-screen" class="hidden">
        <button onclick="backToHome()" style="background:#95a5a6; margin-bottom:10px;">返回主選單</button>
        <div id="list-content">載入中...</div>
    </div>
</div>

<script src="quiz_list.js"></script>

<script>
    // 1. 全域變數設定
    // 重要：請將此處替換為你 Google 試算表「發佈到網路」後的 CSV 或 JSON 連結
    const SHEET_URL = "你的_GOOGLE_SHEET_CSV_下載連結"; 

    // 2. 初始化選單
    window.onload = function() {
        const listDiv = document.getElementById('quiz-list-container');
        if(window.allQuizzes) {
            window.allQuizzes.forEach(q => {
                let div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `<strong>${q.name}</strong><br><small>代碼: ${q.code}</small>`;
                div.onclick = () => showRank(q.code, q.name);
                listDiv.appendChild(div);
            });
        }
    };

    // 3. 核心功能：顯示排行榜 (修復版)
    async function showRank(code, title) {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('rank-screen').classList.remove('hidden');
        document.getElementById('list-content').innerHTML = "正在同步全班數據...";

        let allData = [];

        // A. 先抓本地資料 (你自己的紀錄)
        let localLogs = JSON.parse(localStorage.getItem('qz_logs') || '[]');
        allData = localLogs.filter(l => l.code === code);

        // B. (進階) 嘗試從網路同步 (若你有設定 SHEET_URL)
        try {
            const response = await fetch(SHEET_URL);
            const csvText = await response.text();
            // 這裡需要解析 CSV 並合併到 allData，此處示範邏輯
            console.log("已同步雲端數據");
        } catch (e) {
            console.log("目前僅顯示本地數據");
        }

        // C. 排序
        allData.sort((a, b) => b.score - a.score);

        // D. 渲染表格
        renderTable(allData, title);
    }

    function renderTable(data, title) {
        if (data.length === 0) {
            document.getElementById('list-content').innerHTML = "<p>尚無測驗紀錄</p>";
            return;
        }

        let h = `<h3>${title} 排名</h3><table><tr><th>名次</th><th>姓名</th><th>成績</th></tr>`;
        let passed = false;

        data.forEach((l, i) => {
            if (!passed && l.score < 60) {
                h += `<tr class="pass-line"><td colspan="3">--- 以下不及格 ---</td></tr>`;
                passed = true;
            }
            h += `<tr><td>${i+1}</td><td>${l.user}</td><td>${l.score}分</td></tr>`;
        });
        document.getElementById('list-content').innerHTML = h + "</table>";
    }

    function backToHome() {
        document.getElementById('rank-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
    }

    function startQuiz() {
        const code = document.getElementById('quiz-code').value;
        const name = document.getElementById('user-name').value;
        if(!name || !code) return alert("請輸入姓名與代碼");
        
        // 轉跳到測驗頁面的邏輯
        location.href = `quiz.html?code=${code}&user=${encodeURIComponent(name)}`;
    }
</script>

</body>
</html>
